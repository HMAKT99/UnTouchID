name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  daemon-tests:
    name: Daemon Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build daemon
        run: cd daemon && swift build --jobs 2

      - name: Run tests
        run: cd daemon && swift test --jobs 2

      - name: Build PAM module
        run: make -C pam all test

      - name: Check migration syntax
        run: |
          for script in scripts/*.sh installer/build-release.sh tests/e2e-validation.sh pam/tests/*.sh; do
            bash -n "$script"
          done
          ruby -c homebrew/touchbridge.rb

      - name: Verify disabled Authorization Plugin entry
        run: bash authplugin/tests/check-disabled.sh

      - name: Verify PAM binary
        run: file pam/pam_touchbridge.so

      - name: Verify protected menu helper boundary
        run: |
          swiftc menubar/TouchBridgeMenu/Core/ProtectedInstallation.swift menubar/tests/main.swift -o "$RUNNER_TEMP/touchbridge-menu-path-tests"
          "$RUNNER_TEMP/touchbridge-menu-path-tests"

  protocol-tests:
    name: Protocol Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build protocol
        run: cd protocol && swift build --jobs 2

      - name: Run tests
        run: cd protocol && swift test --jobs 2

  ios-build:
    name: iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd companion && xcodegen generate

      - name: Build for simulator
        run: |
          cd companion
          xcodebuild -project TouchBridge.xcodeproj \
            -scheme TouchBridge \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -jobs 2 CODE_SIGNING_ALLOWED=NO build

      - name: Isolated iOS security tests
        run: |
          TB_DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          xcodebuild test -project companion/TouchBridge.xcodeproj \
            -scheme TouchBridge -destination "id=$TB_DEVICE" \
            -jobs 2 -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
